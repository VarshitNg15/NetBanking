spring:
  application:
    name: eureka-server

server:
  port: 8761

# This application is the registry itself.
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    enable-self-preservation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
