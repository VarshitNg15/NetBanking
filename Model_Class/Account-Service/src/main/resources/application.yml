server:
  address: 0.0.0.0
  port: ${ACCOUNT_SERVER_PORT:${SERVER_PORT:8083}}

spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DB_URL:${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}}
    username: ${ACCOUNT_DB_USERNAME:${DB_USERNAME:ACCOUNT_SCHEMA}}
    password: ${ACCOUNT_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

clients:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    enabled: true
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      access: unrestricted
