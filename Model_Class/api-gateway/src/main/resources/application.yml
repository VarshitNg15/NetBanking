server:
  port: ${GATEWAY_PORT:${SERVER_PORT:8080}}

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/customers/**, /api/v1/users/**, /api/users/**, /api/customers/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/**, /api/accounts/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/v1/transactions/**, /api/transactions/**, /api/v1/statements/**, /api/statements/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 6
                redis-rate-limiter.requestedTokens: 1

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**, /api/notifications/**, /api/v1/audit/**, /api/audit/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:8000"
              - "http://127.0.0.1:8000"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: when_authorized

# 429 is returned by RequestRateLimiter when a request is rejected.
spring.cloud.gateway.server.webflux.filter.request-rate-limiter.deny-empty-key: false
spring.cloud.gateway.server.webflux.filter.request-rate-limiter.empty-key-status-code: 401
