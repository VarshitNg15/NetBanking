<!DOCTYPE html>
<html lang="en-us">
  <head>
    <title>NetBanking Enterprise Portal - Oracle JET Redwood</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
    <link rel="icon" href="https://static.oracle.com/cdn/jet/16.0.0/default/css/redwood/images/favicon.ico" type="image/x-icon" />

    <!-- Oracle JET Redwood Official Theme CSS -->
    <link rel="stylesheet" href="https://static.oracle.com/cdn/jet/16.0.0/default/css/redwood/oj-redwood-min.css" type="text/css"/>

    <!-- Oracle Redwood UX Icon Fonts -->
    <link rel="stylesheet" href="https://static.oracle.com/cdn/fnd/gallery/2404.0.0/images/iconfont/ojuxIconFont.min.css" type="text/css"/>

    <!-- Custom NetBanking Styling -->
    <link rel="stylesheet" href="css/app.css" type="text/css"/>
  </head>
  <body class="oj-web-applayout-body">
    <!-- Navigation template -->
    <script type="text/html" id="navTemplate">
      <li><a href="#">
        <span :class="[[$data.detail.iconClass]]"></span>
        <oj-bind-text value="[[$data.detail.label]]"></oj-bind-text>
      </a></li>
    </script>

    <div id="globalBody">
      <div id="announce" tabindex="-1" class="send-off-screen" :aria-live="[[manner]]" aria-atomic="true">
        <p id="ariaLiveMessage"><oj-bind-text value="[[message]]"></oj-bind-text></p>
      </div>

      <!-- Redwood Side Navigation Drawer -->
      <oj-drawer-popup id="navDrawer" edge="start" opened="{{sideDrawerOn}}"
                       modality="modeless" role="navigation"
                       class="oj-bg-neutral-170 oj-color-invert">
        <div class="nb-drawer-header">
          <div class="nb-brand-mark">
            <span class="oj-ux-ico-bank nb-bank-icon"></span>
            <span class="nb-brand-title">NetBanking</span>
          </div>
          <div class="nb-drawer-user-info" data-bind="visible: isLoggedIn">
            <span class="nb-drawer-email"><oj-bind-text value="[[userLogin]]"></oj-bind-text></span>
            <span class="nb-badge" data-bind="css: isAdmin() ? 'nb-badge-admin' : 'nb-badge-customer'">
              <oj-bind-text value="[[userBadge]]"></oj-bind-text>
            </span>
          </div>
        </div>
        <oj-navigation-list id="navDrawerList" data="[[navDataProvider]]"
                            item.renderer="[[KnockoutTemplateUtils.getRenderer('navTemplate', true)]]"
                            on-click="[[toggleDrawer]]"
                            selection="{{selection.path}}">
        </oj-navigation-list>
        <div class="nb-drawer-footer" data-bind="visible: isLoggedIn">
          <button type="button" class="nb-btn nb-btn-danger nb-btn-block" data-bind="click: logout">
            <span class="oj-ux-ico-log-out" style="margin-right: 4px;"></span>
            Sign Out
          </button>
        </div>
      </oj-drawer-popup>

      <div id="pageContent" class="oj-web-applayout-page">
        <!-- Redwood Global App Header -->
        <header role="banner" class="oj-web-applayout-header nb-header">
          <div class="oj-web-applayout-max-width oj-flex-bar oj-sm-align-items-center nb-header-bar">
            <!-- Mobile Drawer Toggle -->
            <div class="oj-flex-bar-start oj-md-hide">
              <oj-button id="drawerToggleButton" class="oj-button-lg" on-oj-action="[[toggleDrawer]]" chroming="borderless" display="icons">
                <span slot="startIcon" class="oj-web-applayout-offcanvas-icon"></span>
                <span>Menu</span>
              </oj-button>
            </div>

            <!-- Brand Logo & Portal Name -->
            <div class="oj-flex-bar-middle oj-sm-align-items-center">
              <div class="nb-header-logo">
                <span class="oj-ux-ico-bank nb-bank-logo-icon"></span>
                <span class="nb-header-title">NetBanking</span>
                <span class="nb-redwood-pill">REDWOOD</span>
              </div>
            </div>

            <!-- Header Right: User Status & Actions -->
            <div class="oj-flex-bar-end oj-sm-align-items-center nb-header-right">
              <!-- When Logged In -->
              <div class="nb-user-chip" data-bind="visible: isLoggedIn">
                <div class="nb-user-avatar">
                  <span class="oj-ux-ico-contact"></span>
                </div>
                <div class="nb-user-meta oj-sm-only-hide">
                  <span class="nb-user-name"><oj-bind-text value="[[userLogin]]"></oj-bind-text></span>
                  <span class="nb-user-role-tag" data-bind="css: isAdmin() ? 'nb-tag-admin' : 'nb-tag-customer'">
                    <oj-bind-text value="[[userBadge]]"></oj-bind-text>
                  </span>
                </div>
                <button type="button" class="nb-btn nb-btn-sm nb-btn-outline" data-bind="click: logout">
                  <span class="oj-ux-ico-log-out"></span>
                  Sign Out
                </button>
              </div>

              <!-- When Logged Out -->
              <div data-bind="visible: !isLoggedIn()">
                <button type="button" class="nb-btn nb-btn-primary" data-bind="click: function() { goTo('login'); }">
                  <span class="oj-ux-ico-lock"></span>
                  Sign In
                </button>
              </div>
            </div>
          </div>

          <!-- Redwood Navigation Bar (Desktop / Tablet) -->
          <div role="navigation" class="oj-web-applayout-max-width oj-web-applayout-navbar nb-nav-bar-container">
            <oj-tab-bar id="navTabBar" class="oj-sm-only-hide oj-md-condense"
                        data="[[navDataProvider]]"
                        edge="top"
                        item.renderer="[[KnockoutTemplateUtils.getRenderer('navTemplate', true)]]"
                        selection="{{selection.path}}">
            </oj-tab-bar>
          </div>
        </header>

        <!-- Main Dynamic View Container -->
        <main role="main" class="oj-web-applayout-max-width oj-web-applayout-content nb-main-content">
          <oj-module config="[[moduleAdapter.koObservableConfig]]"></oj-module>
        </main>

        <!-- Redwood Footer -->
        <footer class="oj-web-applayout-footer nb-footer" role="contentinfo">
          <div class="oj-web-applayout-footer-item oj-web-applayout-max-width">
            <ul class="nb-footer-list">
              <oj-bind-for-each data="[[footerLinks]]">
                <template>
                  <li>
                    <a :id="[[$current.data.linkId]]" :href="[[$current.data.linkTarget]]" target="_blank" rel="noopener">
                      <oj-bind-text value="[[$current.data.name]]"></oj-bind-text>
                    </a>
                  </li>
                </template>
              </oj-bind-for-each>
            </ul>
          </div>
          <div class="oj-web-applayout-footer-item oj-web-applayout-max-width oj-text-color-secondary oj-typography-body-sm nb-copy">
            NetBanking Microservices Platform &bull; Built with Oracle JET & Redwood Design System &bull; Spring Cloud Gateway :8080
          </div>
        </footer>
      </div>
    </div>

    <!-- Oracle JET RequireJS Bootstrap from Official Oracle CDN -->
    <script type="text/javascript" src="https://static.oracle.com/cdn/jet/16.0.0/3rdparty/require/require.js"></script>
    <script type="text/javascript" src="https://static.oracle.com/cdn/jet/16.0.0/default/js/bundles-config.js"></script>
    <script type="text/javascript" src="js/main.js"></script>
  </body>
</html>
